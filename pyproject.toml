[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pancancer-nuclei"
version = "0.0.1"
description = "Reproducible pan-cancer nucleus instance segmentation and profiling study"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Rane Mahfoud"}]
dependencies = [
  "albumentations==1.4.3",
  "hydra-core>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "pandas>=2.2,<4",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "scikit-image>=0.22,<1",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "seaborn>=0.13,<1",
  "segmentation-models-pytorch>=0.3.4,<1",
  "streamlit>=1.32,<2",
  "torch>=2.2,<3",
  "torchmetrics>=1.3,<2",
  "torchvision>=0.17,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
data-mirror = ["datasets>=2.18,<5"]
dev = [
  "pre-commit>=3.7,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

experiment:
  id: smoke_test
  seed: 20260904

data:
  root: ${oc.env:PANNUKE_ROOT}
  train_fold: fold1
  validation_fold: fold2
  test_fold: fold3
  subset_size: 64
  image_size: 256
  num_workers: 0

model:
  architecture: unet
  encoder: resnet18
  encoder_weights: imagenet
  semantic_classes: 6
  boundary_output: false

training:
  epochs: 2
  batch_size: 4
  precision: "32"
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  deterministic: true

postprocess:
  method: connected_components
  foreground_threshold: 0.5
  minimum_instance_area_px: 10
